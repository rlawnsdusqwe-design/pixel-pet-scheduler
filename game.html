<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>미니게임</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;user-select:none;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  canvas{position:fixed;inset:0;width:100%;height:100%;cursor:none}
  .hud{position:fixed;top:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:rgba(20,22,26,.82);color:#fff;
    border-radius:999px;padding:8px 18px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .hud small{font-weight:400;opacity:.7;font-size:12px}
  .card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;color:#14161a;border-radius:18px;padding:26px 30px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.3);min-width:300px;cursor:default}
  .card h2{margin:0 0 6px;font-size:22px}.card p{margin:0 0 18px;color:#5d6470}
  .card button{font:inherit;font-size:14px;border-radius:10px;padding:10px 18px;border:1px solid #d5d9e0;background:#fff;cursor:pointer;margin:0 4px}
  .card button.p{background:#4f5bd5;border-color:#4f5bd5;color:#fff;font-weight:600}
  [hidden]{display:none!important}
</style></head>
<body>
  <canvas id="cv"></canvas>
  <div class="hud"><span id="score">0점</span><span>·</span><span id="time">45초</span><small>마우스·← → 로 움직이기 · ESC 종료</small></div>
  <div class="card" id="start"><h2>간식 받기</h2><p>바탕화면 위로 떨어지는 간식을 받아요.<br>⭐ +5점 · 💣 -5점</p><button class="p" id="go">시작</button><button id="quit1">닫기</button></div>
  <div class="card" id="end" hidden><h2 id="endTitle"></h2><p id="endText"></p><button class="p" id="again">다시 하기</button><button id="quit2">닫기</button></div>
  <script src="shared.js"></script>
  <script src="render.js"></script>
  <script src="sound.js"></script>
  <script src="game.js"></script>
</body></html>
